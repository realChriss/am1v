<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- near-black tile with the same off-centre lift as the .am-page radials -->
    <radialGradient id="tile" cx="22%" cy="16%" r="86%">
      <stop offset="0%" stop-color="#23272d" />
      <stop offset="62%" stop-color="#101215" />
      <stop offset="100%" stop-color="#08090b" />
    </radialGradient>
    <!-- chrome: specular at top and bottom, dimmed through the middle -->
    <linearGradient id="chrome" x1="0" y1="17" x2="0" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="36%" stop-color="#d2d7dd" />
      <stop offset="52%" stop-color="#98a0a8" />
      <stop offset="76%" stop-color="#e9ebef" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <!-- the tube glow of .am-mark, as a gradient rather than a blur filter -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d2ebff" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#c6e2ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#c6e2ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#tile)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" />

  <circle cx="32" cy="32" r="22" fill="url(#halo)" />

  <!-- corner ticks: the .am-symbol framing motif -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.4" stroke-linecap="square">
    <path d="M6.5 13.5v-7h7" />
    <path d="M50.5 6.5h7v7" />
    <path d="M57.5 50.5v7h-7" />
    <path d="M13.5 57.5h-7v-7" />
  </g>

  <!-- single-storey "a": bowl and stem share one gradient in user space -->
  <g fill="url(#chrome)">
    <circle cx="32" cy="32" r="11.7" fill="none" stroke="url(#chrome)" stroke-width="6.6" />
    <rect x="40.4" y="17" width="6.6" height="30" rx="0.6" />
  </g>
</svg>
